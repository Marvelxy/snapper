name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to create releases on tags

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      # Builds both slices (arm64 + x86_64) and merges them into one
      # universal Snapper.app, exactly like a local `make app`.
      - name: Build universal app
        run: Scripts/build-app.sh release

      - name: Zip app bundle
        run: ditto -c -k --keepParent build/Snapper.app Snapper-macOS-universal.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snapper-macOS-universal
          path: Snapper-macOS-universal.zip

  # When you push a tag like v1.0.0, attach the zip to a GitHub release so
  # people can download it without building from source.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-14
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Snapper-macOS-universal

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          Snapper-macOS-universal.zip
          --title "${GITHUB_REF_NAME}"
          --generate-notes
