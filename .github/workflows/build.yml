name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to create releases on tags

jobs:
  # One installable app bundle per chip, built in parallel.
  build:
    strategy:
      matrix:
        include:
          - arch: arm64
            label: Apple-Silicon
          - arch: x86_64
            label: Intel
    runs-on: macos-14
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      # The runner default Xcode ships Swift 5.10; the package needs Swift 6,
      # so pick the newest installed Xcode.
      - name: Select latest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          swift --version

      # Single-arch bundle: an installable Snapper.app for this chip.
      - name: Build app (${{ matrix.arch }})
        run: Scripts/build-app.sh release ${{ matrix.arch }}

      - name: Zip app bundle
        run: ditto -c -k --keepParent build/Snapper.app Snapper-macOS-${{ matrix.label }}.zip

      # DMG with drag-to-/Applications install experience.
      - name: Build DMG
        run: >
          hdiutil create
          -volname Snapper
          -srcfolder build/Snapper.app
          -ov -format UDZO
          Snapper-macOS-${{ matrix.label }}.dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Snapper-macOS-${{ matrix.label }}
          path: |
            Snapper-macOS-${{ matrix.label }}.zip
            Snapper-macOS-${{ matrix.label }}.dmg

  # When you push a tag like v1.0.0, attach both zips to a GitHub release so
  # people can download the build for their Mac without building from source.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-14
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Snapper-macOS-*
          merge-multiple: true

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          Snapper-macOS-Apple-Silicon.zip
          Snapper-macOS-Apple-Silicon.dmg
          Snapper-macOS-Intel.zip
          Snapper-macOS-Intel.dmg
          --title "${GITHUB_REF_NAME}"
          --generate-notes
